/* =========================================================================
   GAMEHUB — estilo de la colección.
   Galaxia profunda: el negro del espacio, una nebulosa violeta, rosada y azul
   que se mueve despacio, estrellas que titilan, y el color propio de cada juego
   (chicle rosa y menta, amanecer naranja y cielo, oro y violeta, esmeralda).
   ========================================================================= */
:root {
  --ink: #05030c; --ink2: #0d0822; --ink3: #171034; --line: rgba(206,188,255,.14); --line2: rgba(214,196,255,.26);
  --text: #f6f2ff; --mute: #b0a7d6; --dim: #6f6798; --gold: #ffd36b; --ok: #6ff0b0; --bad: #ff7a8a;
  --acc: #ff7ad9; --acc2: #a774ff; --acc3: #5b9bff; --acc4: #7fe8ff;
  --cosmic: linear-gradient(100deg, #ff6fcf 0%, #a865ff 48%, #5a8dff 100%);
  --glass: linear-gradient(180deg, rgba(42,27,90,.56), rgba(14,9,34,.7));
  --tya: #ff5d8f; --tya2: #45d6b0; --vto: #ffb36b; --vto2: #6fc3ff; --srt: #ffd36b; --srt2: #9a5cff; --vtg: #3dffa8; --vtg2: #00c8ff;
  --r: 18px; --pad: max(16px, env(safe-area-inset-left)); --padR: max(16px, env(safe-area-inset-right));
  --display: "Bungee", "Russo One", Impact, system-ui, sans-serif; --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: var(--body); font-weight: 600; -webkit-tap-highlight-color: transparent; }
body { overflow: hidden; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
/* el cielo: nebulosa (foto generada) que deriva despacio + estrellas que titilan (lienzo) + velo para leer bien */
.sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--ink); pointer-events: none; }
.sky .neb { position: absolute; inset: -7%; background: #07041a url("assets/galaxia.jpg") 58% 50% / cover no-repeat; animation: drift 80s ease-in-out infinite alternate; will-change: transform; }
@keyframes drift { from { transform: scale(1.02) translate3d(0, 0, 0) rotate(0deg); } to { transform: scale(1.1) translate3d(-2.2%, 1.4%, 0) rotate(1.2deg); } }
.sky .veil { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 75% at 55% 45%, rgba(5,3,12,0), rgba(5,3,12,.5) 100%), linear-gradient(180deg, rgba(5,3,12,.34), rgba(5,3,12,0) 26%, rgba(5,3,12,0) 60%, rgba(5,3,12,.55)); }
#bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#app { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; }
/* mientras se juega, la colección se apaga del todo: el juego queda solo y sin nada que le robe fluidez */
body.playing .sky, body.playing #app, body.playing #notify { display: none !important; }

/* ---------- barra de arriba ---------- */
.top { display: flex; align-items: center; gap: 14px; padding: max(10px, env(safe-area-inset-top)) var(--padR) 8px var(--pad); flex: none; }
.mark { display: flex; align-items: center; gap: 10px; cursor: pointer; border: 0; background: none; padding: 4px 6px 4px 0; }
.mark img { width: 34px; height: 34px; border-radius: 10px; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 4px 18px rgba(150,80,255,.45); }
.mark b { font: 400 20px/1 var(--display); letter-spacing: .03em; background: linear-gradient(90deg, #fff, #e9d8ff 40%, #ffb3ea); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mark b span { background: var(--cosmic); -webkit-background-clip: text; background-clip: text; }
.nav { display: flex; gap: 4px; margin-left: auto; background: rgba(14,9,34,.55); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.nav button { border: 0; background: none; padding: 8px 15px; border-radius: 999px; font-weight: 800; font-size: 14px; color: var(--mute); cursor: pointer; white-space: nowrap; transition: background .2s, color .2s; }
.nav button:hover { color: var(--text); }
.nav button[aria-current="true"] { background: var(--cosmic); color: #fff; box-shadow: 0 4px 18px rgba(168,101,255,.45); text-shadow: 0 1px 2px rgba(40,0,80,.35); }
.nav .n-ico { display: none; }
.nav .n-ico svg { display: block; }
#notify { position: fixed; z-index: 90; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 180%); transition: transform .4s cubic-bezier(.2,.9,.2,1.2); padding: 12px 20px; border-radius: 999px; background: rgba(18,11,42,.96); border: 1px solid var(--line2); font-weight: 800; font-size: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.6); max-width: calc(100vw - 32px); text-align: center; pointer-events: none; }
#notify.show { transform: translate(-50%, 0); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(14,9,34,.55); display: grid; place-items: center; cursor: pointer; flex: none; }
.instbtn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 9px 15px; font-weight: 900; font-size: 13.5px; cursor: pointer; background: var(--cosmic); color: #fff; box-shadow: 0 4px 18px rgba(168,101,255,.4); white-space: nowrap; flex: none; }
.instbtn svg { width: 16px; height: 16px; }
.instbtn:hover { filter: brightness(1.1); }
.iconbtn:hover { background: rgba(255,255,255,.12); }
.iconbtn svg { width: 18px; height: 18px; }

main { position: relative; flex: 1; min-height: 0; }
.view { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; padding: 4px var(--padR) max(18px, env(safe-area-inset-bottom)) var(--pad); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
.view.enter { animation: viewIn .45s cubic-bezier(.2,.8,.2,1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- portada ---------- */
#v-home { display: flex; flex-direction: column; gap: clamp(10px, 2vh, 20px); overflow: hidden; }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex: none; padding: 0 4px; }
.logo { margin: 0; font: 400 clamp(46px, 8.4vw, 124px)/.9 var(--display); letter-spacing: .015em; display: flex; flex-direction: column; align-items: flex-start; }
.logo .k { font-size: max(11px, .17em); letter-spacing: .55em; color: #d9ccff; margin: 0 0 .5em .1em; text-shadow: 0 0 1em rgba(170,110,255,.8); }
.logo .lw { position: relative; display: inline-block; white-space: nowrap; }
/* relieve: la misma palabra detrás, oscura y escalonada hacia abajo */
.logo .ld { position: absolute; inset: 0; color: #160a36; text-shadow: 0 .025em 0 #2b1563, 0 .05em 0 #22104f, 0 .075em 0 #190b3d, 0 .1em 0 #10072a, 0 .16em .12em rgba(0,0,0,.7), 0 0 .6em rgba(150,80,255,.45); }
/* la palabra rellena de galaxia, con un filo de luz */
.logo .lf { position: relative; display: inline-block; background: #9a6bff url("assets/galaxia.jpg") 30% 64% / 175% auto; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: .01em rgba(255,226,255,.34); filter: saturate(1.55) contrast(1.15) brightness(1.06) drop-shadow(0 0 .12em rgba(190,110,255,.6)); }
.spark { position: absolute; width: .26em; height: .26em; pointer-events: none; animation: twinkle 3.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
.spark::before, .spark::after { content: ""; position: absolute; inset: 0; background: radial-gradient(closest-side, #fff, rgba(255,255,255,.0) 70%); }
.spark::before { clip-path: polygon(50% 0, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0 50%, 44% 44%); background: #fff; filter: drop-shadow(0 0 .05em #fff) drop-shadow(0 0 .12em var(--sc, #c9a2ff)); }
.spark::after { inset: 30%; border-radius: 50%; background: var(--sc, #c9a2ff); filter: blur(.04em); opacity: .9; }
@keyframes twinkle { 0%, 100% { transform: scale(.25) rotate(0deg); opacity: .2; } 45% { transform: scale(1) rotate(45deg); opacity: 1; } 60% { transform: scale(.8) rotate(60deg); opacity: .85; } }
.hero .side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; text-align: right; max-width: 430px; }
.tagline { margin: 0; font-size: clamp(15px, 1.6vw, 20px); font-weight: 800; color: var(--text); line-height: 1.3; text-wrap: balance; }
.tagline small { display: block; color: var(--mute); font-weight: 700; font-size: .8em; margin-top: 4px; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 900; font-size: 15px; letter-spacing: .02em; cursor: pointer; background: rgba(255,255,255,.08); border: 1px solid var(--line2); color: var(--text); transition: transform .15s, background .2s, box-shadow .2s; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.16); transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.98); }
.btn:focus-visible, .nav button:focus-visible, .iconbtn:focus-visible, .chipbtn:focus-visible, .opt:focus-visible { outline: 3px solid var(--acc4); outline-offset: 2px; }
.btn.gold { background: var(--cosmic); color: #fff; border-color: rgba(255,255,255,.38); box-shadow: 0 8px 28px rgba(160,90,255,.42), inset 0 1px 0 rgba(255,255,255,.5); text-shadow: 0 1px 2px rgba(40,0,80,.4); }
.btn.gold:hover { background: var(--cosmic); filter: brightness(1.12) saturate(1.05); }
.btn.big { padding: 15px 30px; font-size: 18px; }
.btn.ghost { background: transparent; }
.btn.small { padding: 8px 14px; font-size: 13px; }
.btn.danger { border-color: rgba(255,122,138,.5); color: #ffc0c8; }
.btn svg { width: 1.1em; height: 1.1em; }

/* las cuatro tajadas */
.slices { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 14px; }
.slice { --c1: #fff; --c2: #fff; position: relative; flex: 1 1 0; min-width: 0; border-radius: 22px; overflow: hidden; cursor: pointer; transform: skewX(-7deg); transition: flex .6s cubic-bezier(.2,.8,.2,1), box-shadow .4s, transform .4s; box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(210,190,255,.16); outline: none; isolation: isolate; }
.slices:hover .slice, .slices.has-open .slice { flex-grow: .78; }
.slices .slice:hover, .slices .slice.open, .slice:focus-visible { flex-grow: 2.3; box-shadow: 0 22px 70px rgba(0,0,0,.6), 0 0 0 2px var(--c1), 0 0 44px color-mix(in srgb, var(--c1) 40%, transparent); }
.slice .unskew { position: absolute; inset: 0 -14%; transform: skewX(7deg); }
.slice .art { position: absolute; inset: 0; background: #000; }
.slice .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.1s; transform: scale(1.08); }
.slice .art img.on { opacity: 1; animation: kb 12s ease-in-out infinite alternate; }
@keyframes kb { from { transform: scale(1.08) translateX(0); } to { transform: scale(1.18) translateX(-2.5%); } }
.slice .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,6,20,.15) 0%, rgba(8,6,20,.05) 35%, rgba(8,6,20,.82) 72%, rgba(8,6,20,.96) 100%), linear-gradient(90deg, color-mix(in srgb, var(--c1) 26%, transparent), transparent 60%); transition: opacity .5s; }
.slice:not(:hover):not(.open) .shade { background: linear-gradient(180deg, rgba(8,6,20,.35), rgba(8,6,20,.55) 50%, rgba(8,6,20,.95)), linear-gradient(90deg, color-mix(in srgb, var(--c1) 22%, transparent), transparent 70%); }
.slice .bar { position: absolute; left: 0; right: 0; top: 0; height: 5px; background: linear-gradient(90deg, var(--c1), var(--c2)); }
.slice .content { position: absolute; left: 16%; right: 16%; bottom: 0; padding: 0 22px 22px; display: flex; flex-direction: column; gap: 8px; }
.slice .num { font: 400 13px/1 var(--display); letter-spacing: .2em; color: var(--c1); opacity: .9; }
.slice .kind { font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.7); }
.slice .more { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .55s cubic-bezier(.2,.8,.2,1), opacity .35s; }
.slice .more > div { overflow: hidden; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.slice:hover .more, .slice.open .more, .slice:focus-visible .more { grid-template-rows: 1fr; opacity: 1; }
.slice .desc { margin: 0; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.86); max-width: 46ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); white-space: nowrap; }
.slice .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.slices:hover .slice:not(:hover) .kind, .slices.has-open .slice:not(.open) .kind { display: none; }
.slices:hover .slice:not(:hover) .glogo, .slices.has-open .slice:not(.open) .glogo { font-size: clamp(18px, 1.9vw, 28px); white-space: normal; }
.slices:hover .slice:not(:hover) .content, .slices.has-open .slice:not(.open) .content { left: 15%; right: 15%; padding: 0 12px 16px; }
.slice .play { background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 70%, #fff), var(--c1)); color: var(--ink0, #140d1a); border: 0; box-shadow: 0 8px 26px color-mix(in srgb, var(--c1) 45%, transparent); }
.slice .play:hover { filter: brightness(1.08); }

/* logotipos de cada juego (con su letra) */
.glogo { margin: 0; line-height: .95; font-size: clamp(26px, 3vw, 46px); white-space: nowrap; }
.glogo.tya { font-family: "Fredoka", var(--body); font-weight: 700; color: var(--tya); -webkit-text-stroke: .1em #2a1710; paint-order: stroke fill; letter-spacing: .01em; }
.glogo.tya .a2 { color: var(--tya2); }
.glogo.tya .y { display: inline-block; font-size: .5em; width: 1.6em; height: 1.6em; line-height: 1.55em; text-align: center; border-radius: 50%; background: #ffd84d; color: #2a1710; -webkit-text-stroke: 0; border: .12em solid #2a1710; vertical-align: middle; transform: translateY(-.2em); margin: 0 .12em; }
.glogo.vento { font-family: "Comfortaa", var(--body); font-weight: 700; color: #fff; letter-spacing: .02em; text-shadow: 0 0 .35em rgba(255,190,140,.55), 0 .06em 0 rgba(120,60,90,.5); }
.glogo.sorti { font-family: "Macondo", serif; font-weight: 400; background: linear-gradient(180deg, #fff3c4, #ffd36b 45%, #c88a1c 80%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 .25em rgba(255,200,90,.5)) drop-shadow(0 .05em 0 rgba(60,20,80,.9)); letter-spacing: .02em; font-size: clamp(30px, 3.4vw, 52px); }
.glogo.vtg { font-family: "Russo One", var(--display); font-weight: 400; font-style: italic; letter-spacing: .04em; background: linear-gradient(180deg, #e9fff4 0%, #3dffa8 48%, #0b9e64 52%, #7dffc8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .05em 0 #02261a) drop-shadow(0 0 .3em rgba(61,255,168,.45)); transform: skewX(-8deg); display: inline-block; }

/* franja del torneo en la portada */
.tbanner { flex: none; display: flex; align-items: center; gap: 16px; margin: 0 4px; padding: 12px 14px 12px 18px; border-radius: 18px; background: linear-gradient(90deg, rgba(255,95,200,.2), rgba(150,90,255,.2) 50%, rgba(80,140,255,.2)), rgba(12,8,30,.55); border: 1px solid var(--line2); cursor: pointer; box-shadow: 0 10px 34px rgba(0,0,0,.3); }
.tbanner:hover { background: linear-gradient(90deg, rgba(255,95,200,.3), rgba(150,90,255,.3) 50%, rgba(80,140,255,.3)), rgba(12,8,30,.55); }
.tbanner .cup { width: 42px; height: 42px; flex: none; }
.tbanner b { font: 400 17px/1.1 var(--display); letter-spacing: .02em; }
.tbanner p { margin: 2px 0 0; color: var(--mute); font-size: 13px; font-weight: 700; }
.tbanner .btn { margin-left: auto; }

/* ---------- ficha de un juego ---------- */
.detail { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; max-width: 1240px; margin: 0 auto; padding-top: 6px; }
.media { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 9; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px var(--line2); }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .8s; }
.media img.on { opacity: 1; }
.thumbs { display: flex; gap: 8px; margin-top: 10px; }
.thumbs button { flex: 1; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; border: 2px solid transparent; padding: 0; cursor: pointer; background: #000; opacity: .55; transition: opacity .2s, border-color .2s; }
.thumbs button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs button[aria-pressed="true"] { opacity: 1; border-color: var(--gc1); }
.dinfo { display: flex; flex-direction: column; gap: 14px; }
.dinfo .back { align-self: flex-start; }
.dinfo .lead { margin: 0; font-size: 16px; line-height: 1.5; color: rgba(255,255,255,.88); }
.dinfo h3 { margin: 6px 0 0; font: 400 13px/1 var(--display); letter-spacing: .14em; color: var(--gc1); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.modes div { padding: 10px 12px; border-radius: 12px; background: rgba(16,10,40,.55); border: 1px solid var(--line); }
.modes b { display: block; font-size: 14px; } .modes span { font-size: 12.5px; color: var(--mute); line-height: 1.35; }
.keys { display: grid; gap: 6px; font-size: 13.5px; }
.keys div { display: flex; gap: 10px; align-items: baseline; }
.keys b { flex: none; font: 400 11px/1 var(--display); padding: 5px 8px; border-radius: 6px; background: var(--gc1); color: #160f20; }
.keys .j2 b { background: var(--gc2); }
.note { font-size: 13px; color: var(--mute); line-height: 1.45; }
.bigplay { align-self: stretch; }

/* ---------- escenario del juego (marco) ---------- */
#stage { position: fixed; inset: 0; z-index: 50; background: #000; }
#frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; opacity: 0; transition: opacity .5s; }
#stage.ready #frame { opacity: 1; }
.loader { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse 58% 48% at 50% 50%, rgba(5,3,12,.74), rgba(5,3,12,.4) 72%, rgba(5,3,12,.82)), radial-gradient(ellipse at 50% 62%, color-mix(in srgb, var(--gc1) 30%, transparent), transparent 70%), #05030c url("assets/galaxia.jpg") center / cover; transition: opacity .5s, visibility 0s .5s; z-index: 2; }
#stage.ready .loader { opacity: 0; visibility: hidden; pointer-events: none; }
#stage.ready .loader * { animation: none !important; }
.loader .lbox { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; padding: 20px; }
.loader .glogo { font-size: clamp(40px, 7vw, 84px); }
.lbar { width: min(320px, 70vw); height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
.lbar i { display: block; height: 100%; width: 30%; border-radius: 6px; background: linear-gradient(90deg, var(--gc1), var(--gc2)); animation: load 1.1s ease-in-out infinite; }
@keyframes load { 0% { transform: translateX(-110%); } 100% { transform: translateX(340%); } }
.loader .ltip { color: #ddd5f5; font-size: 14px; max-width: 46ch; line-height: 1.45; text-shadow: 0 1px 10px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.8); }
.loader .lerr { color: #ffc0c8; font-weight: 800; }
.htoast { position: absolute; z-index: 5; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translate(-50%, -140%); transition: transform .45s cubic-bezier(.2,.9,.2,1.2), visibility 0s .45s; visibility: hidden; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 999px; background: rgba(14,8,34,.94); border: 1px solid var(--line2); box-shadow: 0 12px 40px rgba(0,0,0,.6); font-weight: 800; font-size: 14px; max-width: calc(100vw - 24px); }
.htoast.show { transform: translate(-50%, 0); visibility: visible; transition: transform .45s cubic-bezier(.2,.9,.2,1.2), visibility 0s; }
.htoast .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 10px var(--ok); }

/* ---------- paneles y formularios ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding-top: 6px; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: 0 14px 44px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); }
.h1 { font: 400 clamp(26px, 3.2vw, 40px)/1 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.h2 { font: 400 15px/1.1 var(--display); letter-spacing: .1em; margin: 0 0 12px; color: var(--acc); text-shadow: 0 0 .8em rgba(255,110,210,.35); }
.sub { color: var(--mute); margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; max-width: 70ch; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* asistente del torneo */
.wiz { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.steps { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; }
.steps button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent; background: none; padding: 10px 12px; border-radius: 14px; color: var(--mute); font-weight: 800; cursor: pointer; }
.steps button i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 400 12px/1 var(--display); font-style: normal; background: rgba(255,255,255,.08); flex: none; }
.steps button[aria-current="true"] { color: var(--text); background: rgba(255,255,255,.07); border-color: var(--line2); }
.steps button[aria-current="true"] i { background: var(--cosmic); color: #fff; box-shadow: 0 0 14px rgba(168,101,255,.6); }
.steps button.ok i { background: rgba(111,240,176,.2); color: var(--ok); }
.wfoot { display: flex; gap: 10px; justify-content: space-between; margin-top: 16px; }
.presets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.preset { text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 16px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.preset:hover { border-color: var(--line2); background: rgba(255,255,255,.08); }
.preset b { font: 400 14px/1.1 var(--display); letter-spacing: .02em; }
.preset span { font-size: 12.5px; color: var(--mute); line-height: 1.35; }
.players { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 8px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); cursor: pointer; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.prow input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: 800 17px var(--body); padding: 8px 4px; outline: none; }
.prow input:focus { box-shadow: inset 0 -2px 0 var(--acc); }
.prow .x { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.06); cursor: pointer; flex: none; }

/* =========================================================================

const GAMES = [
  {
    id: 'tira-y-afloja', file: 'games/tira-y-afloja.html', name: 'Tira y Afloja', short: 'Tira y Afloja', num: '01',
    tag: 'Duelo de chicle', kind: 'Física y empujones',
    desc: 'Dos chicles unidos por un hilo pelean en el colegio: tirar te hace pesado, aflojar te vuelve ágil. Empuja, embiste, salta en tirachinas y echa al otro a la caneca.',

  /* ---------- pantalla completa: la maneja la colección (también cuando la pide un juego) ---------- */
  const FS = (() => {

      try {
        if (d.requestFullscreen) return d.requestFullscreen({ navigationUI: 'hide' }).then(() => { lock(); return true; }, () => false);
        if (d.webkitRequestFullscreen) { d.webkitRequestFullscreen(); return new Promise(r => setTimeout(() => r(!!el()), 300)); }

  /* ---------- lanzador: cada juego en su propio marco ---------- */

  function estimate() {

  function dashAct(a) {

      const txt = summaryText(T);

      try { navigator.clipboard.writeText(txt).then(done, () => openModal(`<h3>Resumen del torneo</h3><p>Cópialo de aquí:</p><textarea class="textin" style="max-width:none;height:220px;font-size:13px" readonly>${esc(txt)}</textarea><div class="mbtns" style="margin-top:12px"><button class="btn gold" data-mclose>Listo</button></div>`)); } catch (e) { openModal(`<h3>Resumen del torneo</h3><textarea class="textin" style="max-width:none;height:220px;font-size:13px" readonly>${esc(txt)}</textarea><div class="mbtns" style="margin-top:12px"><button class="btn gold" data-mclose>Listo</button></div>`); }

      confirmBox('¿Terminar el torneo?', 'Se pierde lo jugado de este torneo (no entra al salón de la fama).', 'Sí, terminarlo', () => { Tour.T = null; Store.del('tour'); W = null; renderTorneo(); });

  function summaryText(T) {

    function confetti() {
      const cv = $('#confetti'), x = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
      cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; x.scale(dpr, dpr);
      const P = Array.from({ length: 180 }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight, vx: (Math.random() - 0.5) * 60, vy: 80 + Math.random() * 160, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 8, s: 5 + Math.random() * 7, c: COLORS[Math.floor(Math.random() * COLORS.length)] }));
      let last = performance.now();
      const fr = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; x.clearRect(0, 0, innerWidth, innerHeight); for (const p of P) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; if (p.y > innerHeight + 20) { p.y = -20; p.x = Math.random() * innerWidth; } x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); } raf = requestAnimationFrame(fr); };

  /* ---------- app instalable, actualizaciones sin perder nada y copia de seguridad ---------- */
  const App = (() => {
    // fuera de la vista previa (en GitHub Pages, con https) se puede instalar y trabajar sin internet
    const hosted = (/^https:$/.test(location.protocol) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) && !/(^|\.)claude\.(ai|site)$|claudeusercontent|anthropic/.test(location.hostname);
    const installed = () => { try { return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true; } catch (e) { return false; } };
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const android = /Android/i.test(navigator.userAgent);
    const PREFIXES = ['tya_', 'vto_', 'srt_', 'vtg_', PRE];
    let deferred = null, persisted = false, pendingUpdate = false;

    addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; refreshBtn(); if (view === 'ajustes') renderSettings(); });
    addEventListener('appinstalled', () => { deferred = null; refreshBtn(); persist(); notify('¡GameHub quedó instalada! Ábrela desde su ícono.'); if (view === 'ajustes') renderSettings(); });
    btn.addEventListener('click', () => { Snd.click(); install(); });
    function persist() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { persisted = v; }).catch(() => {}); } catch (e) { /* nada */ } }
    try { if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(v => { persisted = v; }).catch(() => {}); } catch (e) { /* nada */ }
    // pedir que el navegador no borre el progreso (se pide con el primer toque, que es cuando lo deja)
    addEventListener('pointerdown', () => { if (hosted) persist(); }, { once: true, capture: true });
    function install() {
      if (deferred) { const d = deferred; deferred = null; d.prompt(); d.userChoice.then(r => { refreshBtn(); if (r && r.outcome === 'accepted') persist(); }).catch(() => {}); return; }
      if (ios) {
        openModal(`<h3>Instalar GameHub en ${/iPad/.test(navigator.userAgent) || navigator.maxTouchPoints > 1 && !/iPhone/.test(navigator.userAgent) ? 'el iPad' : 'el iPhone'}</h3><p>Así queda con su ícono, a pantalla completa y funcionando sin internet:</p>
          <ol class="steps-ios"><li>Abre esta página en <b>Safari</b>.</li><li>Toca <b>Compartir</b> ${ICON.share} (abajo o arriba).</li><li>Elige <b>«Agregar a inicio»</b> ${ICON.plus} y luego <b>Agregar</b>.</li></ol><div class="mbtns"><button class="btn gold" data-mclose>Entendido</button></div>`);

      }

        openModal(`<h3>Instalar GameHub en Android</h3><p>Para que quede como app propia, con su ícono y sin el logo de Chrome en la esquina:</p>
          <ol class="steps-ios"><li>Si la abriste desde otra app (WhatsApp, Gmail, Claude…), toca <b>⋮</b> arriba a la derecha → <b>«Abrir en Chrome»</b>.</li><li>Ya en Chrome, toca este mismo botón <b>Instalar</b> (o <b>⋮</b> → <b>«Instalar app»</b>) y confirma con <b>Instalar</b>.</li><li>Si Chrome pregunta entre <b>Instalar</b> y <b>Crear acceso directo</b>, elige <b>Instalar</b>: el acceso directo es el que sale con el logo de Chrome.</li></ol>
          <p>¿Ya tienes un ícono con el logo de Chrome? Bórralo primero (déjalo presionado → <b>Eliminar</b>) y vuelve a instalar. Tu progreso no se pierde.</p><div class="mbtns"><button class="btn gold" data-mclose>Entendido</button></div>`);
        return;
      }
      openModal(`<h3>Instalar GameHub</h3><p>Tu navegador no mostró el botón directo. Se puede igual:</p><ol class="steps-ios"><li>En <b>Chrome</b> o <b>Edge</b>: menú <b>⋮</b> → <b>«Instalar GameHub»</b> (o «Agregar a la pantalla principal» en el celular).</li><li>En <b>Safari</b> del Mac: menú <b>Archivo → Agregar al Dock</b>.</li></ol><div class="mbtns"><button class="btn gold" data-mclose>Entendido</button></div>`);
    }
    // versión nueva: el service worker trae lo nuevo; se avisa (y nunca se recarga en medio de un juego)
    function showUpdate() {
      if (Launcher.open_) { pendingUpdate = true; return; }
      const u = $('#update'); u.innerHTML = '<span class="dot"></span><span>Hay una versión nueva de GameHub. Tu progreso queda igual.</span><button class="btn small gold" id="upgo">Actualizar</button><button class="btn small ghost" id="upno" aria-label="Después">✕</button>'; u.hidden = false;
      $('#upgo').onclick = () => location.reload(); $('#upno').onclick = () => { u.hidden = true; };
    }
    async function check(manual) {
      try {
        const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw 0; const j = await r.json();
        if (j.v && j.v !== BUILD.v) { showUpdate(); return true; }

      } catch (e) { if (manual) notify('No se pudo revisar (¿sin internet?). Se revisa sola cuando vuelva la conexión.'); }

    function register() {
      if (!hosted || !('serviceWorker' in navigator)) return;
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
        reg.addEventListener('updatefound', () => { const nw = reg.installing; if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'activated') check(false); }); });

    // copia de seguridad: todo lo de los 4 juegos y de GameHub en un archivo (o un texto para pegar)
    function collect() { const data = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && PREFIXES.some(p => k.startsWith(p))) data[k] = localStorage.getItem(k); } } catch (e) { /* nada */ } return { app: 'GameHub', v: 1, date: new Date().toISOString(), build: BUILD.v, data }; }
    function exportBackup() {
      const json = JSON.stringify(collect()), name = `gamehub-progreso-${new Date().toISOString().slice(0, 10)}.json`, n = Object.keys(JSON.parse(json).data).length;
      openModal(`<h3>Copia de seguridad</h3><p>${n} datos guardados (récords, campañas, ajustes y torneos de los 4 juegos). ${hosted ? 'Guárdala como archivo, o copia el texto y pégalo en un chat o una nota.' : 'Copia el texto y guárdalo en un chat o una nota (en esta vista previa no se pueden descargar archivos).'}</p><div class="mbtns" style="justify-content:flex-start">${hosted ? `<button class="btn gold" id="bkfile">${ICON.down} Descargar archivo</button>` : ''}<button class="btn${hosted ? '' : ' gold'}" id="bkcopy">Copiar texto</button><button class="btn ghost" data-mclose>Cerrar</button></div>`);
      if ($('#bkfile')) $('#bkfile').onclick = () => { try { const b = new Blob([json], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); notify('Archivo listo: ' + name); } catch (e) { notify('Aquí no se pudo descargar: usa «Copiar texto».'); } };
      $('#bkcopy').onclick = () => { const ok = () => notify('Copia copiada: guárdala donde quieras.'); try { navigator.clipboard.writeText(json).then(ok, () => showText(json)); } catch (e) { showText(json); } };
    }
    function showText(json) { openModal(`<h3>Copia de seguridad</h3><p>Selecciona todo el texto y cópialo:</p><textarea class="textin" style="max-width:none;height:200px;font-size:12px" readonly>${esc(json)}</textarea><div class="mbtns"><button class="btn gold" data-mclose>Listo</button></div>`); const t = $('#modal textarea'); t.focus(); t.select(); }
    function importBackup() {
      openModal(`<h3>Restaurar una copia</h3><p>Elige el archivo de la copia (o pega su texto). Reemplaza el progreso de este aparato por el de la copia.</p><div class="row" style="margin-bottom:10px"><label class="btn small" style="cursor:pointer">Elegir archivo<input type="file" id="bkin" accept=".json,application/json,text/plain" hidden></label></div><textarea class="textin" id="bktxt" style="max-width:none;height:120px;font-size:12px" placeholder="…o pega aquí el texto de la copia"></textarea><div class="mbtns" style="margin-top:12px"><button class="btn ghost" data-mclose>Cancelar</button><button class="btn gold" id="bkgo">Restaurar</button></div>`);
      $('#bkin').onchange = e => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#bktxt').value = String(r.result || ''); }; r.readAsText(f); };
      $('#bkgo').onclick = () => {
        let j = null; try { j = JSON.parse($('#bktxt').value); } catch (e) { j = null; }
        if (!j || j.app !== 'GameHub' || !j.data || typeof j.data !== 'object') { notify('Eso no parece una copia de GameHub.'); return; }
        const keys = Object.keys(j.data).filter(k => PREFIXES.some(p => k.startsWith(p)) && typeof j.data[k] === 'string');
        confirmBox('¿Restaurar la copia?', `Se cargan ${keys.length} datos de la copia del ${new Date(j.date).toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric' })} y se reemplaza el progreso actual de este aparato.`, 'Sí, restaurar', () => {
          try { const old = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && PREFIXES.some(p => k.startsWith(p))) old.push(k); } old.forEach(k => localStorage.removeItem(k)); keys.forEach(k => localStorage.setItem(k, j.data[k])); } catch (e) { notify('No se pudo guardar en este aparato.'); return; }
          notify('Copia restaurada. Recargando…'); setTimeout(() => location.reload(), 900);
        });
      };
    }
    refreshBtn();
    return {
      register, state: () => ({ hosted, installed: installed(), persisted, ios }),
      install, update: () => check(true), export: exportBackup, import: importBackup,
      afterGame() { if (pendingUpdate) { pendingUpdate = false; showUpdate(); } },
    };
  })();

  /* ---------- modal y avisos ---------- */
  function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="mbox" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; $$('[data-mclose]', m).forEach(b => b.onclick = () => { Snd.back(); closeModal(); }); m.onclick = e => { if (e.target === m) closeModal(); }; const f = $('button', m); if (f) f.focus(); }
  function closeModal() { $('#modal').hidden = true; }
  function confirmBox(t, p, yes, fn) { openModal(`<h3>${esc(t)}</h3><p>${esc(p)}</p><div class="mbtns"><button class="btn ghost" data-mclose>Cancelar</button><button class="btn gold" data-myes>${esc(yes)}</button></div>`); $('[data-myes]').onclick = () => { closeModal(); fn(); }; }
  function notify(msg) { const t = $('#notify'); t.textContent = msg; t.classList.add('show'); clearTimeout(notify.t); notify.t = setTimeout(() => t.classList.remove('show'), 2600); }
  addEventListener('keydown', e => { if (e.key === 'Escape' && !Launcher.open_) { if (!$('#modal').hidden) closeModal(); else if (!$('#champ').hidden) Champ.hide(); else if (view === 'game') go('home'); } });

  /* ---------- pantalla completa ---------- */
  $('#fsbtn').addEventListener('click', () => { Snd.click(); FS.toggle().then(ok => { if (!ok) notify(FS.help()); }); });

  /* ---------- arranque ---------- */
  const h = (location.hash || '').slice(1);
  if (h.startsWith('ficha-') && GAME[h.slice(6)]) go('game', h.slice(6), false);
  else if (['torneo', 'fama', 'ajustes'].includes(h)) go(h, null, false);
  else go('home', null, false);
  BG.start();
  // en GitHub Pages: app instalable, sin internet y con actualizaciones que no tocan el progreso
  App.register();
  window.GAMEHUB = { Tour, Torneo, Launcher, go, GAMES, FS, App };
})();

</script>
</body>
