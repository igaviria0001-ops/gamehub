<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameHub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="GameHub: Tira y Afloja, Ventolera, Sortilegio y VÉRTIGO, cuatro juegos para dos en un solo lugar, y un torneo combinado para jugar con los amigos.">
<meta name="theme-color" content="#05030c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GameHub">
<meta name="application-name" content="GameHub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="assets/icons/icon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="preload" as="image" href="assets/galaxia.jpg">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<style>
/*__FONTS__*/
/*__CSS__*/
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="neb"></div><canvas id="bg"></canvas><div class="veil"></div></div>
<div id="app">
  <header class="top">
    <button class="mark" data-go="home" aria-label="GameHub: inicio"><img src="assets/icons/icon-64.png" alt="" width="34" height="34"><b>GAME<span>HUB</span></b></button>
    <nav class="nav" aria-label="Secciones">
      <button data-go="home" aria-current="true"><span class="n-txt">Juegos</span><span class="n-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="17.5" cy="13.8" r="1" fill="currentColor"/></svg></span></button>
      <button data-go="torneo"><span class="n-txt">Torneo</span><span class="n-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3.5 4M17 6h3a3 3 0 0 1-3.5 4M12 14v4M8 20h8"/></svg></span></button>
      <button data-go="fama"><span class="n-txt">Salón de la fama</span><span class="n-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></span></button>
      <button data-go="ajustes"><span class="n-txt">Ajustes</span><span class="n-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></span></button>
    </nav>
    <button class="instbtn" id="instbtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg><span>Instalar</span></button>
    <button class="iconbtn" id="fsbtn" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </header>
  <main>
    <section class="view" id="v-home" aria-label="Juegos"></section>
    <section class="view" id="v-game" hidden></section>
    <section class="view" id="v-torneo" hidden aria-label="Torneo combinado"></section>
    <section class="view" id="v-fama" hidden aria-label="Salón de la fama"></section>
    <section class="view" id="v-ajustes" hidden aria-label="Ajustes"></section>
  </main>
</div>
<div id="stage" hidden>
  <div class="loader"><div class="lbox"><div id="ltitle"></div><div class="lbar"><i></i></div><div class="ltip" id="ltip"></div><div class="lerr" id="lerr" hidden></div><div class="row" id="lbtns" hidden style="justify-content:center"><button class="btn gold" id="lretry">Reintentar</button><button class="btn" id="lback">Volver a la colección</button></div></div></div>
  <iframe id="frame" title="Juego" allow="fullscreen; autoplay; gamepad; screen-wake-lock"></iframe>
  <div class="htoast" id="htoast" role="status"></div>
</div>
<div id="champ" hidden></div>
<div id="modal" hidden></div>
<div id="notify" role="status" aria-live="polite"></div>
<div id="update" hidden role="status"></div>
<script>
/*__JS__*/
</script>
</body>
</html>
